name: Gerar APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Criar arquivos do app
        run: |
          mkdir -p www
          echo '{"name":"minha-ia","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^6.1.2","@capacitor/android":"^6.1.2"},"devDependencies":{"@capacitor/cli":"^6.1.2"}}' > package.json
          echo '{"appId":"com.minhaia.app","appName":"Minha IA","webDir":"www"}' > capacitor.config.json
          cat > www/index.html <<'HTMLEOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="theme-color" content="#0E1424">
          <link rel="manifest" href="manifest.json">
          <link rel="icon" href="icon-192.png">
          <title>Minha IA</title>
          <style>
          :root{--bg:#0E1424;--pn:#172036;--ln:#2A3556;--tx:#E8ECF7;--mu:#8D98B8;--ac:#7C5CFF;--ok:#3DDC97;--wm:#FFB84D}
          *{box-sizing:border-box}
          html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
          body{display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0)}
          header{display:flex;align-items:center;gap:8px;padding:10px 12px;border-bottom:1px solid var(--ln)}
          header h1{font-size:18px;margin:0;flex:1}
          button,select,input,textarea{font:inherit;color:inherit}
          .ic{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 11px;cursor:pointer}
          .ic.on{background:var(--ac);border-color:var(--ac)}
          .ic.net.on,.ic#gpt.on{background:var(--ok);border-color:var(--ok);color:#06241A}
          #chat{flex:1;overflow-y:auto;padding:14px 12px;display:flex;flex-direction:column;gap:12px}
          .m{max-width:92%;padding:10px 13px;border-radius:14px;white-space:pre-wrap;word-wrap:break-word}
          .u{align-self:flex-end;background:var(--ac)}
          .a{align-self:flex-start;background:var(--pn);border:1px solid var(--ln)}
          .m img{max-width:100%;border-radius:10px;display:block;margin-bottom:6px}
          pre{background:#080C18;border:1px solid var(--ln);border-radius:10px;padding:10px;overflow-x:auto;font-size:13px;position:relative;white-space:pre}
          pre button{position:absolute;top:6px;right:6px;font-size:12px;padding:3px 8px;border-radius:8px;border:1px solid var(--ln);background:var(--pn);cursor:pointer}
          .empty{margin:auto;text-align:center;color:var(--mu);padding:20px}
